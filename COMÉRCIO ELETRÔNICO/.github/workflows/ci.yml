name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  qualidade:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://easyshop:easyshop_local@localhost:5432/easyshop?schema=public
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run check
      - run: npm run test:seed
      - run: npm run build
      - run: docker compose config --quiet
